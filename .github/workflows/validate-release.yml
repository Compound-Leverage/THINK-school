name: THINK School release validation
on:
  push:
    branches: [Staging, main]
  pull_request:
    branches: [Staging, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate marketplace and documentation
        run: python scripts/validate_release.py
      - name: Check generated plugin output matches _source
        run: python scripts/check_build_drift.py
      - name: Build and verify cross-platform release packages
        run: python scripts/build_release_packages.py
      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: think-school-release-packages
          path: release-packages/
          if-no-files-found: error
