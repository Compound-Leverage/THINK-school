long_description: |-
  A Managed Team that finds, qualifies, researches, and helps you pursue opportunities your team otherwise would not have time to work.

  It searches for relevant government contracts, grants and funding, and business development opportunities, determines fit against your criteria, reviews opportunity documents and requirements, and organizes the research, reporting, and next actions needed to keep selected pursuits moving.

  Bring your own organizational criteria, CRM, enrichment tools, opportunity sources, and document storage. Nothing is pre-wired to a specific vendor.

